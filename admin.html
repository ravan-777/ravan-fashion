<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAVAN — Admin Dashboard</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #070707;
  --panel: #111111;
  --panel2: #151515;
  --border: #292929;
  --text: #ffffff;
  --muted: #888888;
  --gold: #c5c542;
  --green: #4ade80;
  --red: #ff6b6b;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 24px;
}

.container {
  width: 100%;
  max-width: 1250px;
  margin: 0 auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 22px;
  margin-bottom: 28px;
  border-bottom: 1px solid var(--border);
}

.brand {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.logo {
  font-size: 30px;
  font-weight: 900;
  letter-spacing: 5px;
}

.subtitle {
  color: var(--muted);
  font-size: 12px;
  letter-spacing: 2px;
}

button {
  border: 0;
  background: white;
  color: black;
  padding: 11px 18px;
  border-radius: 6px;
  font-weight: 700;
  cursor: pointer;
}

button:hover {
  opacity: .85;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  margin-bottom: 22px;
}

.card {
  background: var(--panel);
  border: 1px solid #1e1e1e;
  border-radius: 10px;
  padding: 22px;
}

.card-label {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 2px;
  margin-bottom: 10px;
}

.card-value {
  font-size: 28px;
  font-weight: 800;
}

.status-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  min-height: 24px;
}

.status {
  color: var(--muted);
  font-size: 13px;
}

.database {
  color: var(--green);
  font-size: 12px;
  font-weight: 700;
}

.database.offline {
  color: var(--red);
}

.error-box {
  display: none;
  background: rgba(255,107,107,.08);
  border: 1px solid rgba(255,107,107,.3);
  color: var(--red);
  padding: 14px;
  border-radius: 8px;
  margin-bottom: 18px;
  font-size: 13px;
}

.table-wrap {
  background: var(--panel);
  border: 1px solid #1e1e1e;
  border-radius: 10px;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 850px;
}

thead {
  background: var(--panel2);
}

th {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 1px;
  text-align: left;
  padding: 15px;
  white-space: nowrap;
}

td {
  padding: 15px;
  border-top: 1px solid var(--border);
  font-size: 13px;
  white-space: nowrap;
}

.order-id {
  font-weight: 700;
}

.customer {
  color: #dddddd;
}

.money {
  font-variant-numeric: tabular-nums;
}

.status-pending {
  display: inline-block;
  color: #facc15;
  background: rgba(250,204,21,.08);
  border: 1px solid rgba(250,204,21,.2);
  padding: 5px 9px;
  border-radius: 20px;
  font-size: 11px;
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 35px;
}

footer {
  text-align: center;
  color: #444;
  font-size: 9px;
  letter-spacing: 1px;
  margin-top: 22px;
  padding-bottom: 20px;
}

@media (max-width: 700px) {
  body {
    padding: 16px;
  }

  header {
    align-items: flex-start;
    gap: 15px;
  }

  .stats {
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .card {
    padding: 18px;
  }

  .card-value {
    font-size: 24px;
  }

  .logo {
    font-size: 25px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="brand">
    <div class="logo">RAVAN</div>
    <div class="subtitle">ADMIN DASHBOARD</div>
  </div>

  <button id="refreshButton" type="button">
    Refresh
  </button>
</header>

<section class="stats">

  <div class="card">
    <div class="card-label">TOTAL ORDERS</div>
    <div class="card-value" id="totalOrders">0</div>
  </div>

  <div class="card">
    <div class="card-label">PENDING ORDERS</div>
    <div class="card-value" id="pendingOrders">0</div>
  </div>

  <div class="card">
    <div class="card-label">TOTAL SALES</div>
    <div class="card-value" id="totalSales">₹0</div>
  </div>

</section>

<div class="status-row">
  <div class="status" id="status">
    Loading orders...
  </div>

  <div class="database" id="databaseStatus">
    ● DATABASE LIVE
  </div>
</div>

<div class="error-box" id="error"></div>

<div class="table-wrap">

<table>

<thead>
<tr>
  <th>ORDER ID</th>
  <th>CUSTOMER EMAIL</th>
  <th>SUBTOTAL</th>
  <th>SHIPPING</th>
  <th>TOTAL</th>
  <th>STATUS</th>
  <th>DATE</th>
</tr>
</thead>

<tbody id="ordersTable">
</tbody>

</table>

</div>

<footer>
  RAVAN · WEAR YOUR POWER
</footer>

</div>

<script>
async function loadOrders() {

  const status =
    document.getElementById("status");

  const table =
    document.getElementById("ordersTable");

  const error =
    document.getElementById("error");

  const databaseStatus =
    document.getElementById("databaseStatus");

  error.style.display = "none";
  error.textContent = "";

  status.textContent = "Loading orders...";
  table.innerHTML = "";

  try {

    const response = await fetch(
      "/api/admin/orders",
      {
        method: "GET",
        credentials: "include",
        cache: "no-store",
        headers: {
          "Accept": "application/json"
        }
      }
    );

    const contentType =
      response.headers.get("content-type") || "";

    if (!response.ok) {
      throw new Error(
        "Unable to load admin orders. HTTP " +
        response.status
      );
    }

    if (!contentType.includes("application/json")) {
      throw new Error(
        "Admin authentication response was not JSON."
      );
    }

    const data =
      await response.json();

    if (!data.ok) {
      throw new Error(
        data.error || "Unknown server error"
      );
    }

    const orders =
      Array.isArray(data.orders)
        ? data.orders
        : [];

    databaseStatus.textContent =
      "● DATABASE LIVE";

    databaseStatus.classList.remove(
      "offline"
    );

    document.getElementById(
      "totalOrders"
    ).textContent = orders.length;

    const pending =
      orders.filter(
        order =>
          order.status === "Pending Payment"
      ).length;

    document.getElementById(
      "pendingOrders"
    ).textContent = pending;

    const sales =
      orders.reduce(
        (sum, order) =>
          sum + Number(order.total || 0),
        0
      );

    document.getElementById(
      "totalSales"
    ).textContent =
      "₹" +
      sales.toLocaleString("en-IN");

    if (orders.length === 0) {

      table.innerHTML =
        '<tr>' +
        '<td colspan="7" class="empty">' +
        'No orders found.' +
        '</td>' +
        '</tr>';

      status.textContent =
        "No orders yet.";

      return;
    }

    orders.forEach(order => {

      const row =
        document.createElement("tr");

      const date =
        order.created_at
          ? new Date(
              order.created_at
            ).toLocaleString("en-IN")
          : "-";

      row.innerHTML = `
        <td class="order-id">
          ${escapeHtml(order.id)}
        </td>

        <td class="customer">
          ${escapeHtml(order.customer_email)}
        </td>

        <td class="money">
          ₹${Number(
            order.subtotal || 0
          ).toLocaleString("en-IN")}
        </td>

        <td class="money">
          ₹${Number(
            order.shipping || 0
          ).toLocaleString("en-IN")}
        </td>

        <td class="money">
          ₹${Number(
            order.total || 0
          ).toLocaleString("en-IN")}
        </td>

        <td>
          <span class="status-pending">
            ${escapeHtml(order.status)}
          </span>
        </td>

        <td>
          ${escapeHtml(date)}
        </td>
      `;

      table.appendChild(row);
    });

    status.textContent =
      orders.length +
      " order(s) loaded successfully.";

  } catch (err) {

    console.error(err);

    databaseStatus.textContent =
      "● DATABASE ERROR";

    databaseStatus.classList.add(
      "offline"
    );

    status.textContent =
      "Failed to load orders.";

    error.textContent =
      err.message || "Unknown error";

    error.style.display = "block";
  }
}

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

document
  .getElementById("refreshButton")
  .addEventListener(
    "click",
    loadOrders
  );

loadOrders();
</script>

</body>
      </html>
